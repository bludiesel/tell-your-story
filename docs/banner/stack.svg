<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="850" height="330" role="img" aria-label="The stack: Markdown in, one standalone HTML file out. Four packages build a book; three ship inside it. Node only — no server, no browser, no build step.">
  <title>The stack</title>

  <!--
    Every number on this card is measured, not decorative:
      4 packages   — markdown-it (+container, attrs counted as one family),
                     linkedom, yaml, @svgdotjs/svg.js
      3 bundled    — page-flip, GSAP, curtains.js, already committed as one
                     pre-built file so nothing is fetched at build time
      199 checks   — scripts/check.ts on this commit
      22 layouts   — src/layout.ts LAYOUTS, all proved reachable by verify.ts
      1 file out   — the whole point
  -->

  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#03080E"/>
      <stop offset="50%"  stop-color="#0A1E26"/>
      <stop offset="100%" stop-color="#03080E"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1C6B72"/>
      <stop offset="50%"  stop-color="#35C0B6"/>
      <stop offset="100%" stop-color="#1C6B72"/>
    </linearGradient>
    <linearGradient id="out" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F2F7F6"/>
      <stop offset="100%" stop-color="#CFDDDB"/>
    </linearGradient>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <style>
    .in  { animation: pop .7s cubic-bezier(.22,.61,.36,1) both }
    .s1{animation-delay:.15s}.s2{animation-delay:.5s}.s3{animation-delay:.85s}
    .s4{animation-delay:1.15s}.s5{animation-delay:1.4s}.s6{animation-delay:1.6s}
    @keyframes pop { from { opacity:0; transform:translateY(9px) } to { opacity:1; transform:none } }

    /* A pulse travelling the wire, once every few seconds — it reads as the
       pipeline actually running rather than as decoration. */
    .spark { animation: run 4.5s cubic-bezier(.45,0,.55,1) 1.8s infinite }
    @keyframes run { 0% { opacity:0; transform:translateX(0) } 8% { opacity:1 }
                     70% { opacity:1; transform:translateX(388px) } 78%,100% { opacity:0; transform:translateX(388px) } }

    @media (prefers-reduced-motion: reduce) {
      .in { animation:none; opacity:1 } .spark { animation:none; opacity:0 }
    }
  </style>

  <rect width="850" height="330" rx="10" fill="url(#bg2)"/>
  <rect x=".5" y=".5" width="849" height="329" rx="10" fill="none" stroke="#16333F"/>

  <text class="in s1" x="34" y="42" fill="#79C3BD" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" letter-spacing="3.6" font-weight="600">THE WHOLE STACK</text>

  <!-- ── the pipeline ─────────────────────────────────────────────────── -->
  <g font-family="'Segoe UI',Roboto,Arial,sans-serif">
    <line x1="118" y1="104" x2="506" y2="104" stroke="url(#wire)" stroke-width="2" stroke-linecap="round" opacity=".65"/>
    <circle class="spark" cx="118" cy="104" r="4.5" fill="#5FD4CB"/>

    <!-- in -->
    <g class="in s2">
      <rect x="34" y="80" width="84" height="48" rx="7" fill="#0F2733" stroke="#1C6B72"/>
      <text x="76" y="102" fill="#F2F7F6" font-size="13.5" font-weight="700" text-anchor="middle">.md</text>
      <text x="76" y="117" fill="#79C3BD" font-size="10" text-anchor="middle">your lesson</text>
    </g>

    <!-- prep -->
    <g class="in s3">
      <rect x="176" y="80" width="118" height="48" rx="7" fill="#0F2733" stroke="#1C6B72"/>
      <text x="235" y="101" fill="#35C0B6" font-size="12.5" font-weight="700" text-anchor="middle">prep</text>
      <text x="235" y="117" fill="#79C3BD" font-size="10" text-anchor="middle">how to chunk it</text>
    </g>

    <!-- build -->
    <g class="in s4">
      <rect x="352" y="80" width="118" height="48" rx="7" fill="#0F2733" stroke="#1C6B72"/>
      <text x="411" y="101" fill="#35C0B6" font-size="12.5" font-weight="700" text-anchor="middle">build</text>
      <text x="411" y="117" fill="#79C3BD" font-size="10" text-anchor="middle">Node, no browser</text>
    </g>

    <!-- out -->
    <g class="in s5">
      <rect x="524" y="72" width="128" height="64" rx="8" fill="url(#out)"/>
      <rect x="524" y="72" width="128" height="12" rx="8" fill="#0F2733"/>
      <rect x="524" y="80" width="128" height="4" fill="#0F2733"/>
      <text x="588" y="107" fill="#0E2029" font-size="14" font-weight="800" text-anchor="middle">book.html</text>
      <text x="588" y="124" fill="#0F6B65" font-size="10" text-anchor="middle">one file · works offline</text>
      <ellipse cx="588" cy="146" rx="58" ry="6" fill="#03080E" opacity=".7" filter="url(#lift)"/>
    </g>

    <text class="in s6" x="700" y="98" fill="#5FD4CB" font-size="11.5" font-weight="600">no server</text>
    <text class="in s6" x="700" y="114" fill="#5FD4CB" font-size="11.5" font-weight="600">no network</text>
    <text class="in s6" x="700" y="130" fill="#5FD4CB" font-size="11.5" font-weight="600">no build step</text>
  </g>

  <!-- ── what is actually installed ───────────────────────────────────── -->
  <g class="in s5" font-family="'Segoe UI',Roboto,Arial,sans-serif">
    <text x="34" y="180" fill="#79C3BD" font-size="10.5" letter-spacing="2.4" font-weight="600">4 PACKAGES BUILD A BOOK</text>
    <g font-size="11.5" fill="#CFDDDB">
      <rect x="34"  y="192" width="92"  height="26" rx="13" fill="#16333F" stroke="#1C6B72"/><text x="80"  y="209" text-anchor="middle">markdown-it</text>
      <rect x="132" y="192" width="76"  height="26" rx="13" fill="#16333F" stroke="#1C6B72"/><text x="170" y="209" text-anchor="middle">linkedom</text>
      <rect x="214" y="192" width="52"  height="26" rx="13" fill="#16333F" stroke="#1C6B72"/><text x="240" y="209" text-anchor="middle">yaml</text>
      <rect x="272" y="192" width="64"  height="26" rx="13" fill="#16333F" stroke="#1C6B72"/><text x="304" y="209" text-anchor="middle">svg.js</text>
    </g>

    <text x="446" y="180" fill="#79C3BD" font-size="10.5" letter-spacing="2.4" font-weight="600">3 RIDE INSIDE THE BOOK</text>
    <g font-size="11.5" fill="#0E2029">
      <rect x="446" y="192" width="76" height="26" rx="13" fill="#35C0B6"/><text x="484" y="209" text-anchor="middle">page-flip</text>
      <rect x="528" y="192" width="54" height="26" rx="13" fill="#35C0B6"/><text x="555" y="209" text-anchor="middle">GSAP</text>
      <rect x="588" y="192" width="84" height="26" rx="13" fill="#35C0B6"/><text x="630" y="209" text-anchor="middle">curtains.js</text>
    </g>
    <text x="682" y="209" fill="#79C3BD" font-size="10">pre-bundled,</text>
    <text x="682" y="221" fill="#79C3BD" font-size="10">never fetched</text>
  </g>

  <!-- ── measured, not claimed ────────────────────────────────────────── -->
  <line x1="34" y1="248" x2="816" y2="248" stroke="#16333F"/>
  <g class="in s6" font-family="'Segoe UI',Roboto,Arial,sans-serif" text-anchor="middle">
    <g fill="#F2F7F6" font-size="25" font-weight="800">
      <text x="112" y="288">199</text><text x="268" y="288">22</text>
      <text x="424" y="288">1</text><text x="580" y="288">0</text><text x="736" y="288">100%</text>
    </g>
    <g fill="#79C3BD" font-size="10" letter-spacing="1.1">
      <text x="112" y="306">CHECKS PASSING</text><text x="268" y="306">PAGE LAYOUTS</text>
      <text x="424" y="306">FILE DELIVERED</text><text x="580" y="306">SERVERS NEEDED</text><text x="736" y="306">OFFLINE</text>
    </g>
  </g>
</svg>
