<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="850" height="300" role="img" aria-label="Tell Your Story — one Markdown lesson, one standalone HTML flipbook">
  <title>Tell Your Story</title>

  <!--
    Hand-authored, no generator, no dependency. Every colour is lifted straight
    out of theme.json so the banner and the books it advertises cannot drift
    apart: surface_deep #03080E, curtain #0B3A42, curtain_lit #1C6B72,
    accent #35C0B6, paper #F2F7F6.

    Animated with SMIL and CSS only. GitHub's README sanitiser strips <script>
    from an SVG but leaves declarative animation alone, which is the whole
    reason this technique works in a README at all.
  -->

  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03080E"/>
      <stop offset="55%" stop-color="#061C22"/>
      <stop offset="100%" stop-color="#03080E"/>
    </linearGradient>

    <!-- The cloth. Vertical banding IS the fold structure; the shader in the
         real book does the same thing with noise. -->
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#041519"/>
      <stop offset="12%"  stop-color="#1C6B72"/>
      <stop offset="22%"  stop-color="#0B3A42"/>
      <stop offset="34%"  stop-color="#1C6B72"/>
      <stop offset="46%"  stop-color="#0B3A42"/>
      <stop offset="58%"  stop-color="#1C6B72"/>
      <stop offset="70%"  stop-color="#0B3A42"/>
      <stop offset="82%"  stop-color="#175A61"/>
      <stop offset="100%" stop-color="#041519"/>
    </linearGradient>

    <linearGradient id="paperFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F2F7F6"/>
      <stop offset="70%"  stop-color="#E3EDEC"/>
      <stop offset="100%" stop-color="#CFDDDB"/>
    </linearGradient>

    <linearGradient id="boardFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#16333F"/>
      <stop offset="100%" stop-color="#0A2029"/>
    </linearGradient>

    <!-- The pool of light the book stands in. -->
    <radialGradient id="pool" cx="50%" cy="52%" r="46%">
      <stop offset="0%"   stop-color="#35C0B6" stop-opacity=".22"/>
      <stop offset="55%"  stop-color="#1C6B72" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#03080E" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <style>
    /* The curtain parts once, on load, and stays open — a banner that keeps
       replaying its own entrance is scenery that never lets you read. */
    .panel-l { animation: partL 2.6s cubic-bezier(.22,.61,.36,1) .45s both; }
    .panel-r { animation: partR 2.6s cubic-bezier(.22,.61,.36,1) .45s both; }
    @keyframes partL { from { transform: translateX(0) }    to { transform: translateX(-300px) } }
    @keyframes partR { from { transform: translateX(0) }    to { transform: translateX(300px) } }

    .book   { animation: rise 1.5s cubic-bezier(.22,.61,.36,1) 1.5s both; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }

    .say    { animation: fade 1.1s ease-out both; }
    .t1 { animation-delay: 1.9s } .t2 { animation-delay: 2.15s } .t3 { animation-delay: 2.4s }
    @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

    .glow   { animation: breathe 7s ease-in-out infinite; transform-origin: 425px 130px; }
    @keyframes breathe { 0%,100% { opacity: .75 } 50% { opacity: 1 } }

    /* Reduced motion: everything arrives already in place. The final state has
       to be the complete one — the same rule the book itself obeys. */
    @media (prefers-reduced-motion: reduce) {
      .panel-l { animation: none; transform: translateX(-300px) }
      .panel-r { animation: none; transform: translateX(300px) }
      .book, .say { animation: none; opacity: 1 }
      .glow { animation: none }
    }
  </style>

  <rect width="850" height="300" fill="url(#void)"/>
  <ellipse class="glow" cx="425" cy="140" rx="300" ry="110" fill="url(#pool)"/>

  <!-- ── the book, revealed ───────────────────────────────────────────── -->
  <g class="book">
    <ellipse cx="425" cy="212" rx="150" ry="14" fill="#03080E" opacity=".85" filter="url(#soft)"/>

    <!-- left board + leaves -->
    <path d="M425 74 L305 88 Q296 90 296 99 L296 186 Q296 195 305 197 L425 190 Z" fill="url(#boardFace)" stroke="#1C6B72" stroke-width="1.1"/>
    <path d="M425 80 L316 93 Q310 94 310 100 L310 182 Q310 188 316 189 L425 184 Z" fill="url(#paperFace)"/>
    <!-- ruled lines, the book's own paper -->
    <g stroke="#0E2029" stroke-opacity=".13" stroke-width="1">
      <path d="M325 108 L414 105"/><path d="M325 120 L414 117"/><path d="M325 132 L414 129"/>
      <path d="M325 144 L398 141"/>
    </g>

    <!-- right board + leaves -->
    <path d="M425 74 L545 88 Q554 90 554 99 L554 186 Q554 195 545 197 L425 190 Z" fill="url(#boardFace)" stroke="#1C6B72" stroke-width="1.1"/>
    <path d="M425 80 L534 93 Q540 94 540 100 L540 182 Q540 188 534 189 L425 184 Z" fill="url(#paperFace)"/>
    <g stroke="#0E2029" stroke-opacity=".13" stroke-width="1">
      <path d="M436 105 L525 108"/><path d="M436 117 L525 120"/><path d="M436 129 L500 132"/>
    </g>

    <!-- the header band that every page in a real book carries -->
    <path d="M436 90 L525 93 L525 101 L436 98 Z" fill="#0F2733"/>
    <path d="M325 93 L414 90 L414 98 L325 101 Z" fill="#0F2733"/>

    <!-- fore-edge tabs, the book's navigation -->
    <rect x="551" y="104" width="7" height="17" rx="2.5" fill="#35C0B6"/>
    <rect x="551" y="128" width="7" height="17" rx="2.5" fill="#1C6B72"/>
    <rect x="551" y="152" width="7" height="17" rx="2.5" fill="#1C6B72"/>

    <!-- the spine, and the ribbon marker -->
    <path d="M425 74 L425 190" stroke="#03080E" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M425 186 L425 214 L419 206 L413 214 L413 186 Z" fill="#35C0B6" opacity=".92"/>
  </g>

  <!-- ── the curtain, parting ─────────────────────────────────────────── -->
  <g class="panel-l">
    <rect x="0" y="0" width="428" height="300" fill="url(#cloth)"/>
    <rect x="418" y="0" width="12" height="300" fill="#041519" opacity=".8"/>
  </g>
  <g class="panel-r">
    <rect x="422" y="0" width="428" height="300" fill="url(#cloth)"/>
    <rect x="420" y="0" width="12" height="300" fill="#041519" opacity=".8"/>
  </g>

  <!-- the pelmet, which never moves -->
  <rect x="0" y="0" width="850" height="16" fill="#041519"/>
  <rect x="0" y="14" width="850" height="2" fill="#35C0B6" opacity=".55"/>

  <!-- ── the words ────────────────────────────────────────────────────── -->
  <g font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <text class="say t1" x="425" y="42" fill="#79C3BD" font-size="12.5" letter-spacing="4.2" font-weight="600">A CLAUDE CODE SKILL</text>
    <text class="say t2" x="425" y="262" fill="#F2F7F6" font-size="31" font-weight="800" letter-spacing="-.4">Tell Your Story</text>
    <text class="say t3" x="425" y="284" fill="#5FD4CB" font-size="12.5" letter-spacing=".7">one Markdown lesson · one standalone HTML flipbook</text>
  </g>
</svg>
